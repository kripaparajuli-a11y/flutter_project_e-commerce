name: mini_ecommerce_flutter
description: MyShop - a mini e-commerce Flutter application (CIS099-2 assignment).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Carousel package from pub.dev - check https://pub.dev/packages/carousel_slider
  # for the latest version and update the number below if needed.
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Product images are loaded from public URLs, so no local assets are needed.
  # If you switch to local images, uncomment:
  # assets:
  #   - assets/images/
